name: PanOmics build hts tools v1.15
on:
  push:
    branches:
      - asset-bootstrap-v115-20261003
permissions:
  contents: read
jobs:
  build-hts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libdeflate-dev
      - name: Build samtools 1.24
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o samtools-1.24.tar.bz2 https://github.com/samtools/samtools/releases/download/1.24/samtools-1.24.tar.bz2
          echo "89b2a440123eeaa400392ce1736e7d60ce9041843027d76819753c5a8246bfdd  samtools-1.24.tar.bz2" | sha256sum -c -
          tar -xjf samtools-1.24.tar.bz2
          cd samtools-1.24
          ./configure --prefix="$GITHUB_WORKSPACE/samtools-install" --without-curses
          make -j2
          make install
          cd "$GITHUB_WORKSPACE"
          tar -czf samtools-1.24-linux-x86_64-install.tar.gz samtools-install
          sha256sum samtools-1.24-linux-x86_64-install.tar.gz > samtools-1.24-linux-x86_64-install.tar.gz.sha256
      - name: Build bcftools 1.24
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o bcftools-1.24.tar.bz2 https://github.com/samtools/bcftools/releases/download/1.24/bcftools-1.24.tar.bz2
          echo "8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f  bcftools-1.24.tar.bz2" | sha256sum -c -
          tar -xjf bcftools-1.24.tar.bz2
          cd bcftools-1.24
          ./configure --prefix="$GITHUB_WORKSPACE/bcftools-install"
          make -j2
          make install
          cd "$GITHUB_WORKSPACE"
          tar -czf bcftools-1.24-linux-x86_64-install.tar.gz bcftools-install
          sha256sum bcftools-1.24-linux-x86_64-install.tar.gz > bcftools-1.24-linux-x86_64-install.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: panomics-samtools-1.24-built
          path: |
            samtools-1.24-linux-x86_64-install.tar.gz
            samtools-1.24-linux-x86_64-install.tar.gz.sha256
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: panomics-bcftools-1.24-built
          path: |
            bcftools-1.24-linux-x86_64-install.tar.gz
            bcftools-1.24-linux-x86_64-install.tar.gz.sha256
          compression-level: 0
          retention-days: 1
